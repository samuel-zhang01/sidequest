server {
    listen 80;
    server_name _;
    # Docker service IPs can change when a container is replaced. Resolve the
    # private API on every short cache window instead of pinning its startup IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_origin http://api:8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location = /api/live/ws {
        proxy_pass $api_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass $api_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /live {
        try_files /live.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
